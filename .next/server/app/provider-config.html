015db.js\",\"/_next/static/chunks/f89c526f39bbdb0b.js\",\"/_next/static/chunks/7508672046a5a240.js\",\"/_next/static/chunks/1fc23efd8b65dade.js\",\"/_next/static/chunks/6edec4540dafb6db.js\",\"/_next/static/chunks/b55791f4462dd84e.js\",\"/_next/static/chunks/0a9c4d6ec9d22b32.js\",\"/_next/static/chunks/1024c11bf7f0c48c.js\",\"/_next/static/chunks/942d302f4dadf1d4.js\",\"/_next/static/chunks/a02d6361c5713280.js\",\"/_next/static/chunks/5f8a5a0be28f150c.js\",\"/_next/static/chunks/49e340b2ffafabcb.js\",\"/_next/static/chunks/72250ba727446aff.js\",\"/_next/static/chunks/6e6cf5bb2673b896.js\",\"/_next/static/chunks/65ad0d91bb1a4c9d.js\",\"/_next/static/chunks/b50c0e2d506b7efb.js\"],\"ClientWrapper\"]\n14:T2188,"])</script><script>self.__next_f.push([1,"# Provider Configuration\n\nThe `WalletConnectProvider` accepts a configuration object to customize the SDK's behavior. This document describes all available configuration parameters.\n\n## Configuration Interface\n\n```typescript\n  interface WalletConnectKitConfig {\n    connectors?: Awaited\u003cGetConnectorsReturnType\u003e;\n    chains?: Awaited\u003cGetChainsReturnType\u003e;\n    defaultConnectChain?: ChainType;\n    walletConnectProjectId?: string;\n    clientId?: string;\n    metadata?: {\n      name: string;\n      description: string;\n      url: string;\n      icons: string[];\n    };\n    theme?: ThemeConfig;\n    login?: UserLoginConfig;\n  }\n\n```\n\n## Parameters\n\n### connectors\n\nConnector configuration for wallet connections. Must be obtained through `getConnectors()` method, cannot be passed directly.\n\n**Type:** `Awaited\u003cGetConnectorsReturnType\u003e`\n\n**Example:**\n\n```tsx\n  import { getConnectors, WalletConnectProvider } from \"__PACKAGE_NAME__\";\n  import { useEffect, useState } from \"react\";\n\n  function App() {\n  const [connectors, setConnectors] = useState\u003cAwaited\u003cReturnType\u003ctypeof getConnectors\u003e\u003e | undefined\u003e(undefined);\n\n  useEffect(() =\u003e {\n    getConnectors().then(setConnectors);\n  }, []);\n\n  return (\n    \u003cWalletConnectProvider config={{ connectors, clientId: \"your-client-id\" }}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### chains\n\nChain configuration for supported blockchains. Must be obtained through `getChains()` method, cannot be passed directly.\n\n**Type:** `Awaited\u003cGetChainsReturnType\u003e`\n\n**Example:**\n\n```tsx\n  import { getChains, WalletConnectProvider } from \"__PACKAGE_NAME__\";\n  import { useEffect, useState } from \"react\";\n\n  function App() {\n  const [chains, setChains] = useState\u003cAwaited\u003cReturnType\u003ctypeof getChains\u003e\u003e | undefined\u003e(undefined);\n\n  useEffect(() =\u003e {\n    getChains().then(setChains);\n  }, []);\n\n  return (\n    \u003cWalletConnectProvider config={{ chains, clientId: \"your-client-id\" }}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### defaultConnectChain\n\nDefault chain type to connect to when the user opens the wallet modal.\n\n**Type:** `ChainType`\n\n**Default:** `undefined`\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  clientId: \"your-client-id\",\n  defaultConnectChain: \"evm\", // or \"dogecoin\"\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### walletConnectProjectId\n\nWalletConnect project ID. Make sure to replace the projectId with your own WalletConnect Project ID if you wish to use WalletConnect!\n\n**Type:** `string`\n\n**Get your Project ID:** [https://cloud.walletconnect.com/](https://cloud.walletconnect.com/)\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  clientId: \"your-client-id\",\n  walletConnectProjectId: \"your-project-id-here\",\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### clientId\n\nSDK client ID. This is required for embedded wallet functionality, including email passwordless login and social login features.\n\n**Type:** `string`\n\n**Required:** Yes (for embedded wallet features)\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  clientId: \"your-client-id-here\",\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n**Note:** The `clientId` is essential for:\n- Email passwordless wallet creation and authentication\n- Social login integration (Google, X/Twitter)\n- Embedded wallet operations\n- User authentication and session management\n\nGet your client ID from [\u003cSdkName /\u003e](https://sdk.dogeos.com/) before using embedded wallet features.\n\n### metadata\n\nApplication metadata for WalletConnect and wallet connections.\n\n**Type:**\n\n```typescript\n  {\n  name: string;\n  description: string;\n  url: string;\n  icons: string[];\n  }\n\n```\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  clientId: \"your-client-id\",\n  metadata: {\n    name: \"My DApp\",\n    description: \"My decentralized application\",\n    url: \"https://myapp.com\",\n    icons: [\"https://myapp.com/icon.png\"],\n  },\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### theme\n\nTheme configuration for customizing the UI appearance.\n\n**Type:** `ThemeConfig`\n\n```typescript\n  type ThemeConfig = {\n  themes?: {\n    light?: {\n      colors?: Record\u003cstring, string | Record\u003cstring, string\u003e\u003e;\n      [key: string]: unknown;\n    };\n    dark?: {\n      colors?: Record\u003cstring, string | Record\u003cstring, string\u003e\u003e;\n      [key: string]: unknown;\n    };\n    [key: string]: unknown;\n  };\n  [key: string]: unknown;\n  defaultTheme?: \"dark\" | \"light\";\n  };\n\n```\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n  import type { ThemeConfig } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  theme: {\n    themes: {\n      light: {\n        colors: {\n          primary: {\n            DEFAULT: \"#FCD436\",\n            foreground: \"#12122A\",\n          },\n          background: \"#FFFFFF\",\n          foreground: \"#000000\",\n        },\n      },\n      dark: {\n        colors: {\n          primary: {\n            DEFAULT: \"#FF5CB8\",\n            foreground: \"#FFF\",\n          },\n          background: \"#000000\",\n          foreground: \"#FFFFFF\",\n        },\n      },\n    },\n    defaultTheme: \"light\",\n  } as ThemeConfig,\n  clientId: \"your-client-id\",\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n### login\n\nLogin configuration for social and basic login methods.\n\n**Type:** `UserLoginConfig`\n\n```typescript\n  interface UserLoginConfig {\n  basicLogins?: BasicLoginType[];\n  socialLogins?: SocialLoginProvider[];\n  }\n\n  type BasicLoginType = \"email\" | \"externalWallets\";\n\n  type SocialLoginProvider = {\n  type: \"google\" | \"x\";\n  };\n\n```\n\n**Example:**\n\n```tsx\n  import { WalletConnectProvider } from \"__PACKAGE_NAME__\";\n\n  const config = {\n  clientId: \"your-client-id\",\n  login: {\n    // Basic login methods\n    basicLogins: [\"email\", \"externalWallets\"], // or [\"email\"] or [\"externalWallets\"]\n\n    // Social login methods\n    socialLogins: [\n      {\n        type: \"google\",\n      },\n      {\n        type: \"x\",\n      },\n    ],\n  },\n  };\n\n  export function App() {\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```\n\n## Complete Example\n\n```tsx\n  import {\n  WalletConnectProvider,\n  getChains,\n  getConnectors,\n  } from \"__PACKAGE_NAME__\";\n  import type { WalletConnectKitConfig } from \"__PACKAGE_NAME__\";\n  import { useEffect, useState } from \"react\";\n\n  export function App() {\n  const [chains, setChains] = useState\u003c\n    Awaited\u003cReturnType\u003ctypeof getChains\u003e\u003e | undefined\n  \u003e(undefined);\n  const [connectors, setConnectors] = useState\u003c\n    Awaited\u003cReturnType\u003ctypeof getConnectors\u003e\u003e | undefined\n  \u003e(undefined);\n\n  useEffect(() =\u003e {\n    Promise.all([getChains(), getConnectors()]).then(([chains, connectors]) =\u003e {\n      setChains(chains);\n      setConnectors(connectors);\n    });\n  }, []);\n\n  const config: WalletConnectKitConfig = {\n    connectors,\n    chains,\n    defaultConnectChain: \"evm\",\n    walletConnectProjectId: \"your-project-id\",\n    clientId: \"your-client-id\",\n    metadata: {\n      name: \"My DApp\",\n      description: \"My decentralized application\",\n      url: \"https://myapp.com\",\n      icons: [\"https://myapp.com/icon.png\"],\n    },\n    theme: {\n      themes: {\n        light: {\n          colors: {\n            primary: {\n              DEFAULT: \"#FCD436\",\n              foreground: \"#12122A\",\n            },\n            background: \"#FFFFFF\",\n            foreground: \"#000000\",\n          },\n        },\n        dark: {\n          colors: {\n            primary: {\n              DEFAULT: \"#FF5CB8\",\n              foreground: \"#FFF\",\n            },\n            background: \"#000000\",\n            foreground: \"#FFFFFF\",\n          },\n        },\n      },\n      defaultTheme: \"light\",\n    },\n    login: {\n      basicLogins: [\"email\", \"externalWallets\"],\n      socialLogins: [\n        { type: \"google\" },\n        { type: \"x\" },\n      ],\n    },\n  };\n\n  return (\n    \u003cWalletConnectProvider config={config}\u003e\n      \u003cYourApp /\u003e\n    \u003c/WalletConnectProvider\u003e\n  );\n  }\n\n```"])</script><script>self.__next_f.push([1,"5:[\"$\",\"div\",null,{\"className\":\"x:mx-auto x:flex x:max-w-(--nextra-content-width)\",\"children\":[\"$\",\"$L11\",null,{\"value\":[{\"value\":\"Configuration Interface\",\"id\":\"configuration-interface\",\"depth\":2},{\"value\":\"Parameters\",\"id\":\"parameters\",\"depth\":2},{\"value\":\"connectors\",\"id\":\"connectors\",\"depth\":3},{\"value\":\"chains\",\"id\":\"chains\",\"depth\":3},{\"value\":\"defaultConnectChain\",\"id\":\"defaultconnectchain\",\"depth\":3},{\"value\":\"walletConnectProjectId\",\"id\":\"walletconnectprojectid\",\"depth\":3},{\"value\":\"clientId\",\"id\":\"clientid\",\"depth\":3},{\"value\":\"metadata\",\"id\":\"metadata\",\"depth\":3},{\"value\":\"theme\",\"id\":\"theme\",\"depth\":3},{\"value\":\"login\",\"id\":\"login\",\"depth\":3},{\"value\":\"Complete Example\",\"id\":\"complete-example\",\"depth\":2}],\"children\":[[\"$\",\"$L12\",null,{}],[\"$\",\"$L13\",null,{\"metadata\":\"$2:props:children:1:props:children:1:props:pageMap:3:frontMatter\",\"bottomContent\":\"$undefined\",\"sourceCode\":\"$14\",\"children\":[\"$L15\",\"$L16\"]}]]}]}]\n"])</script><script>self.__next_f.push([1,"17:I[625747,[\"/_next/static/chunks/40bf875e7c32ef41.js\",\"/_next/static/chunks/4f7c02ce1aa015db.js\",\"/_next/static/chunks/f89c526f39bbdb0b.js\",\"/_next/static/chunks/7508672046a5a240.js\",\"/_next/static/chunks/1fc23efd8b65dade.js\",\"/_next/static/chunks/6edec4540dafb6db.js\",\"/_next/static/chunks/b55791f4462dd84e.js\",\"/_next/static/chunks/0a9c4d6ec9d22b32.js\",\"/_next/static/chunks/1024c11bf7f0c48c.js\",\"/
