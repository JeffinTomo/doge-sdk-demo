sConnected`\n\n## Next Steps\n\n- Explore the `useWalletConnect` hook for connection management\n- Explore the `useAccount` hook for account information and signing\n- Check out the Provider documentation for chain-specific operations\n\n## Complete Example\n\n```tsx\n  import React from \"react\";\n  import {\n    WalletConnectProvider,\n    useWalletConnect,\n    useAccount,\n  } from \"__PACKAGE_NAME__\";\n\n  function WalletDemo() {\n    const { openModal, isConnected, disconnect } = useWalletConnect();\n    const { address, chainId, signMessage, signInWithWallet } = useAccount();\n\n    return (\n      \u003cdiv\u003e\n        {isConnected ? (\n          \u003cdiv\u003e\n            \u003cdiv\u003eAddress: {address}\u003c/div\u003e\n            \u003cdiv\u003eChain ID: {chainId}\u003c/div\u003e\n            \u003cbutton onClick={() =\u003e signMessage?.({ message: \"Hello\" })}\u003e\n              Sign Message\n            \u003c/button\u003e\n            \u003cbutton onClick={disconnect}\u003eDisconnect\u003c/button\u003e\n          \u003c/div\u003e\n        ) : (\n          \u003cbutton onClick={openModal}\u003eConnect Wallet\u003c/button\u003e\n        )}\n      \u003c/div\u003e\n    );\n  }\n\n  export default function App() {\n    return (\n      \u003cWalletConnectProvider\n        config={{\n          clientId: \"your-client-id\",\n        }}\n      \u003e\n        \u003cWalletDemo /\u003e\n      \u003c/WalletConnectProvider\u003e\n    );\n  }\n\n```\n\n**Note:** Get your client ID from [\u003cSdkName /\u003e](https://sdk.dogeos.com/).\n\n## Connect Button Example\n\n```tsx\n  import { useWalletConnect } from \"__PACKAGE_NAME__\";\n\n  export function ConnectButton() {\n    const { openModal, isConnected, disconnect } = useWalletConnect();\n\n    return (\n      \u003cbutton onClick={() =\u003e (isConnected ? disconnect() : openModal())}\u003e\n        {isConnected ? \"Disconnect\" : \"Connect Wallet\"}\n      \u003c/button\u003e\n    );\n  }\n\n```\n\n## Account Info and Signing Example\n\n```tsx\n  import { useAccount } from \"__PACKAGE_NAME__\";\n\n  export function AccountInfo() {\n    const { address, chainId, signMessage, signInWithWallet } = useAccount();\n\n    const onSignMessage = async () =\u003e {\n      const sig = await signMessage?.({ message: \"Hello Tomo\" });\n      console.log(\"signature:\", sig);\n    };\n\n    const onSignin = async () =\u003e {\n      const token = await signInWithWallet();\n      console.log(\"token:\", token);\n    };\n\n    return (\n      \u003cdiv\u003e\n        \u003cdiv\u003eAddress: {address}\u003c/div\u003e\n        \u003cdiv\u003eChainId: {chainId}\u003c/div\u003e\n        \u003cbutton onClick={onSignMessage}\u003eSign Message\u003c/button\u003e\n        \u003cbutton onClick={onSignin}\u003eSign In With Wallet\u003c/button\u003e\n      \u003c/div\u003e\n    );\n  }\n\n```"])</script><script>self.__next_f.push([1,"5:[\"$\",\"div\",null,{\"className\":\"x:mx-auto x:flex x:max-w-(--nextra-content-width)\",\"children\":[\"$\",\"$L11\",null,{\"value\":[{\"value\":\"Overview\",\"id\":\"overview\",\"depth\":2},{\"value\":\"Installation\",\"id\":\"installation\",\"depth\":2},{\"value\":\"Basic Setup\",\"id\":\"basic-setup\",\"depth\":2},{\"value\":\"1. Wrap your app with WalletConnectProvider\",\"id\":\"1-wrap-your-app-with-walletconnectprovider\",\"depth\":3},{\"value\":\"2. Use the hooks\",\"id\":\"2-use-the-hooks\",\"depth\":3},{\"value\":\"Key Concepts\",\"id\":\"key-concepts\",\"depth\":2},{\"value\":\"Next Steps\",\"id\":\"next-steps\",\"depth\":2},{\"value\":\"Complete Example\",\"id\":\"complete-example\",\"depth\":2},{\"value\":\"Connect Button Example\",\"id\":\"connect-button-example\",\"depth\":2},{\"value\":\"Account Info and Signing Example\",\"id\":\"account-info-and-signing-example\",\"depth\":2}],\"children\":[[\"$\",\"$L12\",null,{}],[\"$\",\"$L13\",null,{\"metadata\":\"$2:props:children:1:props:children:1:props:pageMap:2:frontMatter\",\"bottomContent\":\
